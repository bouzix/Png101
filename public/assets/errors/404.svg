<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="g404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="check404" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#94a3b8" fill-opacity="0.15"/>
      <rect x="8" width="8" height="8" fill="transparent"/>
      <rect y="8" width="8" height="8" fill="transparent"/>
      <rect x="8" y="8" width="8" height="8" fill="#94a3b8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Ambient Glow Behind File -->
  <circle cx="200" cy="150" r="110" fill="url(#glow404)" />

  <!-- Transparent Checkerboard File Canvas -->
  <g transform="translate(110, 50)">
    <rect x="0" y="0" width="180" height="200" rx="20" fill="#0f172a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6" />
    <rect x="8" y="8" width="164" height="184" rx="14" fill="url(#check404)" />

    <!-- Folded Corner -->
    <path d="M140 0 L180 40 L140 40 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />

    <!-- 404 Bold Text inside Canvas -->
    <text x="90" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#g404)" letter-spacing="2">404</text>
    <text x="90" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="1">TRANSPARENT ASSET MISSING</text>

    <!-- Missing Piece / Cutout Dotted Circle -->
    <circle cx="90" cy="155" r="14" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- Floating Magnifying Glass -->
  <g transform="translate(240, 150) rotate(-15)">
    <circle cx="35" cy="35" r="28" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="4" />
    <circle cx="35" cy="35" r="22" fill="#3b82f6" fill-opacity="0.1" />
    <line x1="56" y1="56" x2="82" y2="82" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
    <path d="M22 26 A 14 14 0 0 1 44 22" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Sparkles -->
  <path d="M80 80 Q 90 90 100 90 Q 90 90 90 100 Q 90 90 80 90 Q 90 90 90 80 Z" fill="#60a5fa" opacity="0.7"/>
  <path d="M320 85 Q 328 93 336 93 Q 328 93 328 101 Q 328 93 320 93 Q 328 93 328 85 Z" fill="#38bdf8" opacity="0.6"/>
  <circle cx="95" cy="210" r="3" fill="#60a5fa" opacity="0.5"/>
  <circle cx="310" cy="230" r="4" fill="#3b82f6" opacity="0.6"/>
</svg>

