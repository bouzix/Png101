<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="g500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glow500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="110" fill="url(#glow500)" />

  <!-- Gear 1 -->
  <g transform="translate(140, 80) rotate(15)">
    <circle cx="60" cy="60" r="42" fill="#1e293b" stroke="#f87171" stroke-width="4" />
    <circle cx="60" cy="60" r="18" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
    <!-- Cogs -->
    <rect x="54" y="8" width="12" height="14" rx="3" fill="#f87171" />
    <rect x="54" y="98" width="12" height="14" rx="3" fill="#f87171" />
    <rect x="8" y="54" width="14" height="12" rx="3" fill="#f87171" />
    <rect x="98" y="54" width="14" height="12" rx="3" fill="#f87171" />
  </g>

  <!-- Big Central 500 Badge -->
  <g transform="translate(90, 150)">
    <rect x="0" y="0" width="220" height="70" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="2" />
    <text x="110" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#g500)" letter-spacing="2">500</text>
  </g>

  <!-- Lightning Bolt -->
  <path d="M190 70 L215 110 L195 115 L220 160 L185 125 L205 120 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Warning Sparks -->
  <circle cx="100" cy="90" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="310" cy="130" r="5" fill="#f97316" opacity="0.7"/>
  <circle cx="290" cy="220" r="3" fill="#f59e0b" opacity="0.8"/>
</svg>

